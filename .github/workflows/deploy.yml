name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # pick up new Science posts from renrua52/domain even if this repo is quiet
  schedule:
    - cron: "0 0 * * *" # daily 00:00 UTC = 08:00 Beijing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: sync Science posts from renrua52/domain
        run: python3 scripts/sync_science_posts.py

      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: cache the attention model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen2.5-0.5B-v1

      - run: pip install -r scripts/requirements.txt

      - name: precompute attention (tokenize + single cpu forward pass)
        run: python3 scripts/precompute_attention.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
